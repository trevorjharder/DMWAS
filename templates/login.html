{% extends "base.html" %}
{% block content %}
<section class="about-hero" aria-labelledby="login-heading">
  {% include "snow_saddle_panorama.html" %}
  <div class="about-hero__inner about-hero__inner--centered">
    <p class="eyebrow">Members</p>
    <h1 id="login-heading">Member sign in</h1>
    <p class="about-hero__intro">Sign in with an approved Society account.</p>
  </div>
</section>
<section class="auth-layout">
  <div class="auth-card">
    <form
      method="post"
      action="{{ url_for('login', next=request.args.get('next', '')) }}"
    >
      <input
        type="hidden"
        name="csrf_token"
        value="{{ session.get('csrf_token', '') }}"
      />
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        autocomplete="username"
        required
        maxlength="40"
      />
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      />
      <button class="button button--primary button--full" type="submit">
        Sign in
      </button>
    </form>
    <p class="auth-card__footnote">
      <a href="{{ url_for('forgot_password') }}">Forgot your password?</a>
    </p>
    <p class="auth-card__footnote">
      Need an account?
      <a href="{{ url_for('membership_request') }}">Request member access</a>
    </p>
  </div>
</section>
{% endblock %}
