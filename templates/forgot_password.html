{% extends "base.html" %} {% block content %}
<section class="auth-layout">
  <div class="auth-card">
    <p class="eyebrow">Account recovery</p>
    <h1>Forgot your password?</h1>
    <p>
      Enter the email address associated with your Society account. We’ll send a
      verification code if an account matches.
    </p>
    <form method="post">
      <input
        type="hidden"
        name="csrf_token"
        value="{{ session.get('csrf_token', '') }}"
      />
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        maxlength="254"
        required
      />
      <button class="button button--primary button--full" type="submit">
        Send verification code
      </button>
    </form>
    <p class="auth-card__footnote">
      <a href="{{ url_for('login') }}">Return to sign in</a>
    </p>
  </div>
</section>
{% endblock %}
