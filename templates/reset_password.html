{% extends "base.html" %} {% block content %}
<section class="auth-layout">
  <div class="auth-card">
    <p class="eyebrow">Account recovery</p>
    <h1>Reset your password</h1>
    <p>
      Enter the six-digit code sent to your email and choose a new password. The
      code expires after 10 minutes.
    </p>
    <form method="post">
      <input
        type="hidden"
        name="csrf_token"
        value="{{ session.get('csrf_token', '') }}"
      />
      <label for="code">Email verification code</label>
      <input
        id="code"
        name="code"
        inputmode="numeric"
        autocomplete="one-time-code"
        pattern="[0-9]{6}"
        minlength="6"
        maxlength="6"
        required
      />
      <label for="password">New password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="12"
        required
      />
      <p class="form-hint">Use at least 12 characters.</p>
      <label for="confirm_password">Confirm new password</label>
      <input
        id="confirm_password"
        name="confirm_password"
        type="password"
        autocomplete="new-password"
        minlength="12"
        required
      />
      <button class="button button--primary button--full" type="submit">
        Reset password
      </button>
    </form>
    <p class="auth-card__footnote">
      Didn’t receive a code?
      <a href="{{ url_for('forgot_password') }}">Request another</a>.
    </p>
  </div>
</section>
{% endblock %}
